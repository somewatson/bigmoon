<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Moon - Admin Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        body { font-family: sans-serif; background: #1a1a1a; color: white; margin: 0; padding: 20px; }
        .nav { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .nav a { color: #9146ff; text-decoration: none; font-weight: bold; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: #2a2a2a; padding: 20px; border-radius: 8px; border: 1px solid #444; text-align: center; }
        .stat-value { font-size: 24px; font-weight: bold; color: #9146ff; display: block; margin-top: 10px; }
        .status-section { background: #2a2a2a; padding: 20px; border-radius: 8px; border: 1px solid #444; }
        .status-item { display: flex; justify-content: space-between; padding: 1rem 0; border-bottom: 1px solid #444; }
        .status-value { font-weight: bold; }
        .supported { color: #4caf50; }
        .unsupported { color: #f44336; }
    </style>
</head>
<body>
    <div class="nav">
        <h1>🌙 Admin Dashboard</h1>
        <div>
            <a href="{{ url_for('admin_users') }}" style="margin-right: 20px;">Manage Users</a>
            <a href="{{ url_for('index') }}">Back to Home</a>
        </div>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <span>Disk Usage</span>
            <span class="stat-value">{{ disk_info }}</span>
        </div>
        <div class="stat-card">
            <span>Total Users</span>
            <span class="stat-value">{{ user_count }}</span>
        </div>
        <div class="stat-card">
            <span>Total Tasks</span>
            <span class="stat-value">{{ task_count }}</span>
        </div>
    </div>

    <div class="status-section">
        <h2>System Hardware Status</h2>
        <div id="ffmpeg-status">Loading...</div>
    </div>

    <script>
        async function loadStatus() {
            try {
                const response = await fetch('/api/system/ffmpeg');
                const data = await response.json();
                
                if (data.error) {
                    document.getElementById('ffmpeg-status').innerHTML = `<p class="unsupported">Error: ${data.error}</p>`;
                    return;
                }

                let html = '';
                const labels = {
                    qsv: 'Intel QuickSync (QSV)',
                    nvenc: 'NVIDIA NVENC',
                    vaapi: 'VAAPI',
                    amf: 'AMD AMF',
                    libx264: 'Software x264 (libx264)'
                };

                for (const [key, supported] of Object.entries(data)) {
                    html += `
                        <div class="status-item">
                            <span>${labels[key] || key}</span>
                            <span class="status-value ${supported ? 'supported' : 'unsupported'}">
                                ${supported ? '✓ Supported' : '✗ Unsupported'}
                            </span>
                        </div>
                    `;
                }
                document.getElementById('ffmpeg-status').innerHTML = html;
            } catch (e) {
                document.getElementById('ffmpeg-status').innerHTML = `<p class="unsupported">Failed to fetch status</p>`;
            }
        }
        loadStatus();
    </script>
</body>
</html>
