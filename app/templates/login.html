<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Primary Meta Tags -->
    <meta name="title" content="Big Moon - VOD Manager">
    <meta name="description" content="A powerful Twitch VOD archiving and compression tool with automated pipelines and chat synchronization.">

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://bigmoon.somewatson.com">
    <meta property="og:title" content="Big Moon - VOD Manager">
    <meta property="og:description" content="A powerful Twitch VOD archiving and compression tool with automated pipelines and chat synchronization.">
    <meta property="og:image" content="https://somewatson.com/images/watson_pfp.png">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://bigmoon.somewatson.com">
    <meta property="twitter:title" content="Big Moon - VOD Manager">
    <meta property="twitter:description" content="A powerful Twitch VOD archiving and compression tool with automated pipelines and chat synchronization.">
    <meta property="twitter:image" content="https://somewatson.com/images/watson_pfp.png">
    <title>Big Moon - Login</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a1a; color: white; margin: 0; }
        .login-card { background: #2a2a2a; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; border-radius: 4px; border: 1px solid #444; background: #333; color: white; }
        button { width: 100%; padding: 10px; background: #9146ff; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #772ce8; }
        .error { color: #ff4d4d; font-size: 0.9rem; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="login-card">
        <h2>Big Moon</h2>
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            {% for message in messages %}
              <div class="error">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}
        <form method="POST" id="loginForm">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
<script>
    document.getElementById('loginForm').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
            e.preventDefault();
            this.querySelector('button[type="submit"]').click();
        }
    });
</script>
</html>
